fragment WorkParts on Work {
  __typename
  title
  summary
  previewImage
  liveLink
  githubLink
  year
  role
  techStack
  gallery {
    __typename
    image
    caption
  }
  body
}

fragment ExperienceParts on Experience {
  __typename
  role
  company
  duration
  location
  description
}

fragment HobbyParts on Hobby {
  __typename
  title
  category
  date
  location
  tagline
  photos {
    __typename
    image
    caption
    rotation
  }
  body
}

fragment ProfileParts on Profile {
  __typename
  name
  title
  shortBio
  aboutParagraphs
  resumeLink
  certifications {
    __typename
    name
    issuer
    date
    image
    credentialUrl
    skills
  }
  aiBuddyPrompt
}
